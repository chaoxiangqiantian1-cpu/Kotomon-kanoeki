<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1e3a2f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="KOTOMON" />
  <title>KOTOMON — Sクラス学習RPG（全750種建築・全1000種装飾）</title>
  <style>
    :root {
      --bg-forest-deep: #12251d;
      --bg-forest-mid: #1d392e;
      --bg-paper: #f7f3e8;
      --bg-paper-warm: #efe7d3;
      --ink-primary: #1a2721;
      --ink-muted: #52635a;
      --accent-moss: #2f6f4e;
      --accent-moss-bright: #439369;
      --accent-gold: #c9972c;
      --accent-gold-bright: #eab843;
      --accent-crimson: #b84233;
      --accent-sky: #2d6a8e;
      --border-soft: rgba(27, 40, 34, 0.14);
      --shadow-card: 0 12px 28px rgba(10, 22, 16, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.78);
      --shadow-deep: 0 22px 48px rgba(8, 17, 13, 0.42);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    input, textarea, select { user-select: text; }

    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(122, 186, 136, 0.25), transparent 45%),
        radial-gradient(circle at 85% 20%, rgba(234, 184, 67, 0.18), transparent 42%),
        linear-gradient(170deg, var(--bg-forest-mid) 0%, var(--bg-forest-deep) 100%);
      color: var(--ink-primary);
      overflow: hidden;
    }

    /* 起動ロゴ＆ロード画面 */
    .splash-screen {
      position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 24px;
      background:
        radial-gradient(circle at 50% 28%, rgba(255, 224, 130, 0.24), transparent 48%),
        radial-gradient(circle at 20% 80%, rgba(82, 163, 119, 0.28), transparent 52%),
        linear-gradient(165deg, #1b382a 0%, #10221a 60%, #0b1712 100%);
      color: #fff8e7; transition: opacity 0.45s ease, visibility 0.45s ease;
    }
    .splash-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .splash-scene {
      width: 100%; max-width: 420px; border-radius: 26px; overflow: hidden;
      background: linear-gradient(180deg, #2d5c43 0%, #193326 68%, #12241b 100%);
      border: 2px solid rgba(234, 184, 67, 0.45); box-shadow: var(--shadow-deep);
      padding: 18px; text-align: center;
    }
    .kotomon-wordmark {
      margin: 10px 0 4px; font-size: 32px; font-weight: 900; letter-spacing: 0.08em;
      color: #fff5cc; text-shadow: 0 3px 0 #3b5e2b, 0 8px 18px rgba(0, 0, 0, 0.55);
    }
    .splash-subtitle { font-size: 12px; color: #d8eadb; margin-bottom: 14px; }
    .load-track {
      position: relative; height: 16px; border-radius: 999px; background: rgba(10, 20, 15, 0.72);
      border: 2px solid #8c6d38; overflow: hidden; margin: 10px 0 8px;
    }
    .load-fill { height: 100%; width: 0%; border-radius: 999px; background: linear-gradient(90deg, #65b864 0%, #eab843 100%); transition: width 0.16s ease; }
    .load-status-row { display: flex; justify-content: space-between; font-size: 11px; font-weight: 800; color: #f3e4b3; }

    /* アプリ外枠 */
    .app-shell { display: flex; flex-direction: column; height: 100%; padding-top: var(--safe-top); padding-bottom: var(--safe-bottom); position: relative; }
    .top-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 6px;
      padding: 8px 11px; background: rgba(16, 33, 25, 0.85); backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      color: #f4f7f2; z-index: 20;
    }
    .brand-badge { display: flex; align-items: center; gap: 6px; font-weight: 900; letter-spacing: 0.04em; font-size: 13.5px; cursor: pointer; }
    .brand-leaf { width: 26px; height: 26px; border-radius: 9px; background: linear-gradient(145deg, var(--accent-moss-bright), var(--accent-moss)); display: grid; place-items: center; font-size: 14px; }
    .status-pills { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
    .pill {
      display: inline-flex; align-items: center; gap: 3px; padding: 3px 7px; border-radius: 999px;
      font-size: 10px; font-weight: 800; background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.14); color: #fff;
    }
    .pill.gold { background: linear-gradient(135deg, rgba(234, 184, 67, 0.28), rgba(201, 151, 44, 0.18)); border-color: rgba(234, 184, 67, 0.45); color: #ffe59e; }
    .icon-btn { width: 28px; height: 28px; border-radius: 9px; border: 1px solid rgba(255, 255, 255, 0.16); background: rgba(255, 255, 255, 0.1); color: #fff; font-size: 13px; display: grid; place-items: center; cursor: pointer; }

    .main-view { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 12px 86px; }
    .section-card {
      background: linear-gradient(180deg, var(--bg-paper) 0%, var(--bg-paper-warm) 100%);
      border-radius: 22px; padding: 14px; box-shadow: var(--shadow-card);
      border: 1px solid var(--border-soft); margin-bottom: 12px;
    }
    .card-title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .card-title { margin: 0; font-size: 15px; font-weight: 900; }
    .sub-chip { font-size: 10.5px; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: rgba(47, 111, 78, 0.12); color: var(--accent-moss); }

    /* 図鑑スタイル */
    .dex-strip { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px; }
    .dex-chip {
      flex: 0 0 auto; padding: 7px 11px; border-radius: 14px;
      border: 1.5px solid var(--border-soft); background: rgba(255, 255, 255, 0.74);
      font-size: 11.5px; font-weight: 800; cursor: pointer;
    }
    .dex-chip.active { background: linear-gradient(145deg, var(--accent-moss), var(--bg-forest-deep)); color: #fff; border-color: transparent; }
    .kotomon-sheet {
      background: radial-gradient(circle at 50% 25%, rgba(255, 255, 255, 0.92), rgba(239, 231, 211, 0.68) 70%), var(--bg-paper);
      border-radius: 24px; padding: 14px; border: 1.5px solid rgba(47, 111, 78, 0.22); box-shadow: var(--shadow-card);
    }
    .sheet-header { text-align: center; margin-bottom: 8px; }
    .stage-tag { display: inline-block; font-size: 10.5px; font-weight: 800; padding: 3px 10px; border-radius: 999px; background: rgba(47, 111, 78, 0.14); color: var(--accent-moss); margin-bottom: 4px; }
    .stage-tag.god { background: linear-gradient(90deg, #f6d365 0%, #fda085 100%); color: #3a1d00; }
    .kotomon-name { margin: 0; font-size: 21px; font-weight: 900; }
    .kotomon-sub { font-size: 11.5px; color: var(--ink-muted); margin-top: 2px; }

    .visual-stage {
      position: relative; height: 205px; border-radius: 20px;
      background: radial-gradient(circle at 50% 35%, rgba(176, 228, 186, 0.38), rgba(30, 58, 47, 0.12) 72%), linear-gradient(180deg, #e7f2ea 0%, #d4e6da 100%);
      border: 1px solid rgba(47, 111, 78, 0.2); display: flex; align-items: center; justify-content: center;
      overflow: hidden; margin-bottom: 10px;
    }
    .visual-stage.mode-3d .kotomon-art-wrap { transform: perspective(600px) rotateX(10deg) rotateY(-12deg) scale(1.06); filter: drop-shadow(0 18px 14px rgba(19, 38, 30, 0.28)); }
    .kotomon-art-wrap { transition: transform 0.35s ease; cursor: pointer; }
    .visual-controls-top { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; justify-content: space-between; z-index: 2; }
    .mini-toggle { padding: 4px 9px; border-radius: 999px; border: 1px solid rgba(27, 40, 34, 0.16); background: rgba(255, 255, 255, 0.88); font-size: 10.5px; font-weight: 800; color: var(--ink-primary); cursor: pointer; }

    .stage-switcher { display: flex; gap: 5px; margin-bottom: 10px; }
    .stage-btn { flex: 1; padding: 6px 4px; border-radius: 10px; border: 1px solid var(--border-soft); background: rgba(255, 255, 255, 0.65); font-size: 10.5px; font-weight: 800; color: var(--ink-muted); cursor: pointer; }
    .stage-btn.active { background: var(--accent-moss); color: #fff; border-color: var(--accent-moss); }

    .meta-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .meta-compact { background: rgba(255, 255, 255, 0.75); border: 1px solid var(--border-soft); border-radius: 14px; padding: 8px 10px; font-size: 11.5px; }
    .meta-label { font-size: 10px; font-weight: 800; color: var(--ink-muted); display: block; margin-bottom: 2px; }
    .meta-val { font-weight: 800; }

    .desc-quiz-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 10px; margin-bottom: 10px; }
    .desc-box { background: rgba(255, 255, 255, 0.86); border: 1px solid var(--border-soft); border-radius: 16px; padding: 11px; }
    .desc-box h3 { margin: 0 0 5px; font-size: 12px; font-weight: 800; color: var(--accent-moss); }
    .desc-text { margin: 0; font-size: 12px; line-height: 1.6; }

    .quiz-side-box {
      background: linear-gradient(160deg, rgba(45, 106, 142, 0.12), rgba(47, 111, 78, 0.1));
      border: 1px solid rgba(45, 106, 142, 0.28); border-radius: 16px; padding: 10px;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .quiz-side-title { font-size: 11px; font-weight: 800; color: var(--accent-sky); margin-bottom: 3px; }
    .quiz-side-q { font-size: 11px; font-weight: 700; line-height: 1.38; margin-bottom: 5px; }
    .quiz-mini-opts { display: flex; flex-direction: column; gap: 4px; }
    .mini-opt-btn { text-align: left; padding: 5px 7px; border-radius: 8px; border: 1px solid rgba(45, 106, 142, 0.25); background: rgba(255, 255, 255, 0.92); font-size: 10.5px; font-weight: 700; cursor: pointer; }
    .quiz-feedback { font-size: 10.5px; font-weight: 800; margin-top: 4px; min-height: 14px; }

    .detail-action-row { display: flex; gap: 8px; margin-bottom: 10px; }

    .btn-primary { padding: 9px 12px; border-radius: 12px; border: none; background: linear-gradient(135deg, var(--accent-moss-bright), var(--accent-moss)); color: #fff; font-size: 11.5px; font-weight: 800; cursor: pointer; }
    .btn-gold { padding: 9px 12px; border-radius: 12px; border: none; background: linear-gradient(135deg, var(--accent-gold-bright), var(--accent-gold)); color: #241802; font-size: 11.5px; font-weight: 900; cursor: pointer; }
    .btn-sky { padding: 9px 12px; border-radius: 12px; border: none; background: linear-gradient(135deg, #3c8dbc, var(--accent-sky)); color: #fff; font-size: 11.5px; font-weight: 800; cursor: pointer; }
    .btn-crimson { padding: 9px 12px; border-radius: 12px; border: none; background: linear-gradient(135deg, #d15647, var(--accent-crimson)); color: #fff; font-size: 11.5px; font-weight: 800; cursor: pointer; }

    .stats-panel { background: rgba(255, 255, 255, 0.75); border: 1px solid var(--border-soft); border-radius: 16px; padding: 11px; }
    .stats-top { display: flex; justify-content: space-between; margin-bottom: 7px; font-size: 11.5px; font-weight: 800; }
    .stat-row { display: grid; grid-template-columns: 58px 1fr 78px; align-items: center; gap: 7px; margin-bottom: 5px; font-size: 10.5px; }
    .stat-bar-track { height: 8px; border-radius: 999px; background: rgba(27, 40, 34, 0.1); overflow: hidden; }
    .stat-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent-moss), var(--accent-gold-bright)); }
    .candy-box { margin-top: 9px; padding-top: 9px; border-top: 1px dashed var(--border-soft); display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .evolution-note { margin-top: 8px; padding: 8px 10px; border-radius: 12px; background: rgba(201, 151, 44, 0.14); border: 1px solid rgba(201, 151, 44, 0.35); font-size: 11px; font-weight: 700; color: #4a3303; }

    /* 学習＆バトルUI */
    .mode-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 8px; }
    .mode-pill { flex: 0 0 auto; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--border-soft); background: rgba(255, 255, 255, 0.72); font-size: 11px; font-weight: 800; cursor: pointer; }
    .mode-pill.active { background: var(--accent-sky); color: #fff; border-color: var(--accent-sky); }
    .subject-chips { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
    .subj-btn { padding: 5px 9px; border-radius: 10px; border: 1px solid var(--border-soft); background: rgba(255, 255, 255, 0.7); font-size: 10.5px; font-weight: 800; cursor: pointer; }
    .subj-btn.active { background: var(--accent-moss); color: #fff; border-color: var(--accent-moss); }
    .battle-arena { background: linear-gradient(160deg, #1b3b2d 0%, #10241c 100%); color: #f5f9f6; border-radius: 18px; padding: 11px; margin-bottom: 10px; }
    .hp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    .hp-box { background: rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 7px 9px; }
    .hp-name { font-size: 11px; font-weight: 800; margin-bottom: 4px; display: flex; justify-content: space-between; }
    .hp-bar { height: 8px; border-radius: 999px; background: rgba(255, 255, 255, 0.16); overflow: hidden; }
    .hp-fill { height: 100%; background: #52c48c; }
    .hp-fill.enemy { background: #f26d5b; }
    .battle-log { font-size: 11.5px; line-height: 1.48; background: rgba(0, 0, 0, 0.25); border-radius: 10px; padding: 7px 9px; }
    .question-box { background: rgba(255, 255, 255, 0.88); border: 1px solid var(--border-soft); border-radius: 16px; padding: 11px; }
    .q-meta { font-size: 10.5px; font-weight: 800; color: var(--accent-sky); margin-bottom: 3px; }
    .q-text { font-size: 13.5px; font-weight: 800; line-height: 1.52; margin-bottom: 9px; }
    .choices-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .choice-btn { padding: 9px; border-radius: 12px; border: 1.5px solid rgba(47, 111, 78, 0.26); background: #fff; font-size: 12px; font-weight: 800; text-align: left; cursor: pointer; }
    .typing-row { display: flex; gap: 7px; }
    .typing-input { flex: 1; padding: 8px 11px; border-radius: 12px; border: 1.5px solid var(--accent-moss); font-size: 13px; font-weight: 700; background: #fff; }
    .ref-item { background: rgba(255, 255, 255, 0.82); border: 1px solid var(--border-soft); border-radius: 14px; padding: 9px 11px; margin-bottom: 7px; }
    .ref-item strong { display: block; font-size: 12.5px; color: var(--accent-moss); margin-bottom: 2px; }
    .ref-item span { font-size: 11.5px; line-height: 1.48; }
    .rank-title-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .info-mini-card { background: rgba(255, 255, 255, 0.78); border: 1px solid var(--border-soft); border-radius: 15px; padding: 10px; }
    .info-mini-card h4 { margin: 0 0 3px; font-size: 11px; color: var(--ink-muted); }
    .info-big { font-size: 14px; font-weight: 900; margin-bottom: 4px; }

    /* 3Dキャンプ＆全750種建築・全1000種装飾UI */
    .camp-stage-wrap { position: relative; border-radius: 20px; overflow: hidden; background: #0d1f18; border: 1.5px solid rgba(255, 255, 255, 0.16); box-shadow: var(--shadow-deep); margin-bottom: 10px; }
    #campCanvas { display: block; width: 100%; height: 265px; touch-action: none; }
    .camp-hud-top { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; justify-content: space-between; gap: 6px; flex-wrap: wrap; pointer-events: none; }
    .camp-badge { pointer-events: auto; padding: 5px 9px; border-radius: 999px; background: rgba(13, 28, 22, 0.84); color: #fff; font-size: 10.5px; font-weight: 800; border: 1px solid rgba(255, 255, 255, 0.18); cursor: pointer; }
    .camp-controls-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 7px; background: rgba(15, 31, 24, 0.94); }
    .pad-btn { padding: 7px 4px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.16); background: rgba(255, 255, 255, 0.1); color: #fff; font-size: 11px; font-weight: 800; cursor: pointer; }

    .catalog-filter-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; align-items: center; }
    .catalog-grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-bottom: 8px; }
    .decor-card {
      background: rgba(255, 255, 255, 0.86); border: 1.5px solid var(--border-soft); border-radius: 13px;
      padding: 8px; font-size: 11px; cursor: pointer; display: flex; flex-direction: column; gap: 2px;
    }
    .decor-card.active { border-color: var(--accent-moss); background: rgba(47, 111, 78, 0.14); }
    .pager-row { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 11px; font-weight: 800; margin-top: 6px; }

    .arch-grid { display: grid; grid-template-columns: 1fr; gap: 7px; }
    .arch-item { background: rgba(255, 255, 255, 0.84); border: 1px solid var(--border-soft); border-radius: 15px; padding: 9px 11px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .arch-item.cathedral { background: linear-gradient(135deg, rgba(255, 232, 163, 0.58), rgba(255, 255, 255, 0.92)); border-color: rgba(201, 151, 44, 0.55); }
    .arch-info strong { display: block; font-size: 12px; }
    .arch-info span { font-size: 10.5px; color: var(--ink-muted); display: block; margin-top: 2px; }
    .arch-actions { display: flex; gap: 5px; flex-shrink: 0; }
    .placed-list { font-size: 11px; line-height: 1.5; background: rgba(255, 255, 255, 0.75); border-radius: 12px; padding: 8px 10px; margin-top: 6px; }

    /* 交流・ボードゲームUI */
    .chat-box { background: rgba(255, 255, 255, 0.82); border: 1px solid var(--border-soft); border-radius: 16px; padding: 10px; margin-bottom: 10px; }
    .chat-messages { max-height: 175px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
    .msg-bubble { background: #fff; border: 1px solid var(--border-soft); border-radius: 12px; padding: 7px 10px; font-size: 12px; }
    .msg-meta { font-size: 10px; color: var(--ink-muted); font-weight: 800; margin-bottom: 2px; display: flex; justify-content: space-between; }
    .stamp-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; max-height: 122px; overflow-y: auto; margin-top: 6px; }
    .stamp-btn { padding: 5px 3px; border-radius: 9px; border: 1px solid var(--border-soft); background: #fff; font-size: 10px; font-weight: 800; cursor: pointer; text-align: center; }

    .board-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; background: #2c4c3b; padding: 5px; border-radius: 12px; margin: 8px 0; }
    .board-cell { aspect-ratio: 1 / 1; background: #e8dec5; border-radius: 4px; display: grid; place-items: center; font-size: 12px; font-weight: 900; cursor: pointer; border: none; }
    .board-cell.dark { background: #4f7d64; color: #fff; }

    /* ガチャ・指紋認証ショップ・近日公開UI */
    .gacha-results { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; margin-top: 10px; }
    .gacha-card { background: #fff; border: 1px solid var(--border-soft); border-radius: 12px; padding: 8px; font-size: 11px; font-weight: 800; }
    .fingerprint-zone {
      margin-top: 10px; padding: 14px; border-radius: 18px;
      background: linear-gradient(160deg, rgba(27, 40, 34, 0.06), rgba(45, 106, 142, 0.1));
      border: 1.5px dashed rgba(45, 106, 142, 0.45); text-align: center;
    }
    .fp-btn {
      width: 78px; height: 78px; border-radius: 999px; border: 3px solid var(--accent-sky);
      background: radial-gradient(circle, #ffffff 35%, #d6eaf8 100%);
      font-size: 32px; cursor: pointer; box-shadow: 0 8px 18px rgba(45, 106, 142, 0.25);
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .fp-btn.scanning { transform: scale(1.08); border-color: var(--accent-gold); }

    /* モーダル＆ナビ */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(9, 18, 14, 0.68); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 60; }
    .modal-backdrop.open { display: flex; }
    .modal-card { width: 100%; max-width: 470px; max-height: 84vh; overflow-y: auto; background: var(--bg-paper); border-radius: 24px; padding: 18px; box-shadow: var(--shadow-deep); }
    .modal-title { margin: 0 0 8px; font-size: 18px; font-weight: 900; }
    .modal-body { font-size: 12.5px; line-height: 1.68; }
    .modal-close { margin-top: 14px; width: 100%; padding: 10px; border-radius: 12px; border: none; background: var(--bg-forest-deep); color: #fff; font-weight: 800; cursor: pointer; }

    .bottom-nav {
      position: fixed; left: 0; right: 0; bottom: 0;
      padding: 7px 8px calc(7px + var(--safe-bottom));
      background: rgba(16, 33, 25, 0.94); backdrop-filter: blur(14px);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; z-index: 30;
    }
    .nav-item {
      border: none; background: transparent; color: rgba(255, 255, 255, 0.68);
      padding: 5px 2px; border-radius: 12px; font-size: 10px; font-weight: 800;
      display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer;
    }

      let ctx = null;
      let enabled = true;

      function ensureCtx() {
        if (!ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) ctx = new AudioCtx();
        }
        if (ctx && ctx.state === "suspended") ctx.resume().catch(() => {});
        return ctx;
      }

      function tone(freq, duration = 0.12, type = "sine", gainVal = 0.12, delay = 0) {
        if (!enabled) return;
        const c = ensureCtx();
        if (!c) return;
        const now = c.currentTime + delay;
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(gainVal, now + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0008, now + duration);
        osc.connect(gain);
        gain.connect(c.destination);
        osc.start(now);
        osc.stop(now + duration + 0.02);
      }

        toggle() { enabled = !enabled; if (enabled) this.tap(); return enabled; },

      for (const m of TITLE_MILESTONES) { if (appState.totalCorrect >= m.count) current = m.title; }
      return current;
    }
    function getNextTitleMilestone() { return TITLE_MILESTONES.find((m) => appState.totalCorrect < m.count) || null; }
    function getRankInfo() { return RANK_TIERS.find((r) => r.rank === appState.rankLevel) || RANK_TIERS[0]; }
    function getSpeciesById(id) { return KOTOMON_CATALOG.find((k) => k.id === id) || KOTOMON_CATALOG[0]; }
    function getArchById(id) { return ARCHITECTURE_CATALOG_750.find((a) => a.id === id); }
    function getDecorById(id) { return DECORATION_CATALOG_1000.find((d) => d.id === id) || DECORATION_CATALOG_1000[0]; }

    function computeFinalStats(species, prog) {
      const res = {};
      STAT_KEYS.forEach((k) => {
        res[k] = species.baseStats[k] + Math.floor(prog.level * 1.8) + Math.floor((prog.ev[k] || 0) / 4);
      });
      return res;
    }

    function canAdvanceStage(species, prog) {
      if (prog.stage >= 5) return { ok: false, reason: "最終第5段階に到達済みです！" };
      const nextStage = prog.stage + 1;
      const requiredLevel = nextStage * 8;
      if (prog.level < requiredLevel) return { ok: false, reason: `第${nextStage}段階進化にはLv.${requiredLevel}が必要です（現在Lv.${prog.level}）` };
      if (nextStage === 5 && !appState.hasCathedral) {
        return { ok: false, reason: "神コトモン最終進化（第5段階）には、3Dキャンプに1500コトマネーの『大聖堂』が必要です！" };
      }
      return { ok: true, reason: `第${nextStage}段階へ進化可能！` };
    }

    function feedStudyCandy() {
      const species = getSpeciesById(appState.selectedKotomonId);
      const prog = appState.kotomonProgress[species.id];
      if (appState.candy <= 0) { SoundEngine.wrong(); showToast("勉強飴が足りません！"); return; }
      appState.candy -= 1; prog.level += 1;
      const evKey = STAT_KEYS[prog.level % STAT_KEYS.length];
      prog.ev[evKey] = Math.min(252, (prog.ev[evKey] || 0) + 8);
      SoundEngine.candy();
      showToast(`${species.stages[prog.stage - 1].name} が Lv.${prog.level} に成長！`);
      saveState(); renderAll();
    }

    function evolveKotomon() {
      const species = getSpeciesById(appState.selectedKotomonId);
      const prog = appState.kotomonProgress[species.id];
      const check = canAdvanceStage(species, prog);
      if (!check.ok) { SoundEngine.wrong(); showToast(check.reason); return; }
      prog.stage += 1; appState.viewedStage = prog.stage;
      SoundEngine.evolve();
      showToast(`✨ ${species.stages[prog.stage - 1].name}（第${prog.stage}段階）へ進化！`);
      saveState(); renderAll();
    }

    function pickQuestion() {
      let pool = QUESTION_BANK;
      if (appState.studyMode === "review") {
        const revIds = new Set(appState.reviewQueue);
        const revPool = QUESTION_BANK.filter((q) => revIds.has(q.id));
        if (revPool.length > 0) pool = revPool;
      } else if (appState.studyMode === "exam") {
        pool = QUESTION_BANK.filter((q) => q.exam);
      } else if (appState.selectedSubject !== "すべて") {
        const subPool = QUESTION_BANK.filter((q) => q.subject === appState.selectedSubject);
        if (subPool.length > 0) pool = subPool;
      }
      currentQuestion = pool[Math.floor(Math.random() * pool.length)];
    }

    function startBattle({ tower = false, promo = false } = {}) {
      const species = getSpeciesById(appState.selectedKotomonId);
      const prog = appState.kotomonProgress[species.id];
      const stats = computeFinalStats(species, prog);
      const maxHp = 90 + stats.hp;
      battleState.isTowerBattle = tower; battleState.isPromotionTest = promo;
      battleState.playerMaxHp = maxHp; battleState.playerHp = maxHp;
      if (tower) {
        const eMax = 75 + appState.towerFloor * 22;
        battleState.enemyMaxHp = eMax; battleState.enemyHp = eMax;
        battleState.enemyName = `無限の塔 ${appState.towerFloor}階 ガーディアン`;
        battleState.log = `🗼 無限の塔 ${appState.towerFloor}階！正解して突破しよう！`;
      } else if (promo) {
        const eMax = 100 + appState.rankLevel * 20;
        battleState.enemyMaxHp = eMax; battleState.enemyHp = eMax;
        battleState.enemyName = `ランク${appState.rankLevel + 1} 昇格試験官`;
        battleState.log = `🏅 昇格テスト開始！正解を積み重ねて試験官を倒そう！`;
      } else {
        const eMax = 80 + prog.level * 5;
        battleState.enemyMaxHp = eMax; battleState.enemyHp = eMax;
        battleState.enemyName = `森の試練コトモン（Lv.${prog.level}）`;
        battleState.log = `⚔️ ${species.stages[prog.stage - 1].name} のバトル開始！`;
      }
      pickQuestion();
    }

    function handleAnswerResult(isCorrect) {
      const species = getSpeciesById(appState.selectedKotomonId);
      const prog = appState.kotomonProgress[species.id];
      const stats = computeFinalStats(species, prog);
      const pName = species.stages[prog.stage - 1].name;
      if (isCorrect) {
        SoundEngine.correct(); appState.totalCorrect += 1;
        const dmg = Math.max(24, Math.floor((stats.atk + stats.spa) * 0.34));
        battleState.enemyHp = Math.max(0, battleState.enemyHp - dmg);
        const rewardMoney = battleState.isTowerBattle ? 45 + appState.towerFloor * 10 : 25;
        appState.money += rewardMoney; appState.candy += 1;
        const evStat = appState.selectedSubject === "理科" || appState.selectedSubject === "算数／数学" ? "spa" : "atk";
        prog.ev[evStat] = Math.min(252, (prog.ev[evStat] || 0) + 4);
        appState.reviewQueue = appState.reviewQueue.filter((id) => id !== currentQuestion.id);
        battleState.log = `⭕ 正解！${pName} の一撃で ${dmg} ダメージ！（+${rewardMoney}💰 / +1🍬）`;
        if (battleState.enemyHp <= 0) {
          if (battleState.isTowerBattle) {
            appState.towerFloor += 1; appState.money += 120; appState.candy += 2;
            showToast(`🗼 ${appState.towerFloor - 1}階クリア！`); battleState.isTowerBattle = false;
          } else if (battleState.isPromotionTest) {
            if (appState.rankLevel < 10) { appState.rankLevel += 1; appState.money += 200; showToast(`🏅 ランク${appState.rankLevel}に昇格！`); }
            battleState.isPromotionTest = false;
          } else { appState.money += 50; showToast("🎉 バトル勝利！50コトマネー獲得！"); }
          battleState.enemyHp = battleState.enemyMaxHp;
        }
      } else {
        SoundEngine.wrong();
        const eDmg = Math.max(14, Math.floor(battleState.enemyMaxHp * 0.22));
        battleState.playerHp = Math.max(1, battleState.playerHp - eDmg);
        if (!appState.reviewQueue.includes(currentQuestion.id)) appState.reviewQueue.push(currentQuestion.id);
        battleState.log = `❌ 正解は「${currentQuestion.choices[currentQuestion.answer]}」。${eDmg} ダメージ！`;
      }
      pickQuestion(); saveState(); renderAll();
    }

    // 3Dキャンプ：全750種建築＆全1,000種装飾ロジック
    function buildArchitecture(archId) {
      const arch = getArchById(archId);
      if (!arch || appState.builtArchitecture.includes(arch.id)) return;
      if (appState.money < arch.cost) { SoundEngine.wrong(); showToast(`コトマネー不足（必要：${arch.cost}）`); return; }
      appState.money -= arch.cost;
      appState.builtArchitecture.push(arch.id);
      if (arch.isCathedral) appState.hasCathedral = true;
      SoundEngine.evolve();
      showToast(arch.isCathedral ? "⛪ 超巨大『大聖堂』完成！神コトモン進化解禁！" : `🏗️ 『${arch.name}』を建築しました！（${appState.builtArchitecture.length}/750種）`);
      saveState(); renderAll();
    }

    function enterBuilding(archId) {
      const arch = getArchById(archId);
      if (!arch || !arch.enterable || !appState.builtArchitecture.includes(arch.id)) return;
      SoundEngine.tap();
      appState.insideBuildingId = arch.id;
      appState.campFirstPerson = true;
      playerPose.x = 0; playerPose.z = 4.2; playerPose.yaw = Math.PI;
      if (!appState.indoorFurniture[arch.id]) appState.indoorFurniture[arch.id] = [];
      showToast(`🚪 『${arch.name}』に入室しました！全1000種装飾品を配置できます`);
      saveState(); renderAll();
    }

    function exitBuilding() {
      SoundEngine.tap();
      appState.insideBuildingId = null;
      playerPose.x = 0; playerPose.z = 5.2; playerPose.yaw = 0;
      saveState(); renderAll();
    }

    function getCurrentFurnitureList() {
      if (appState.insideBuildingId) {
        if (!appState.indoorFurniture[appState.insideBuildingId]) appState.indoorFurniture[appState.insideBuildingId] = [];
        return appState.indoorFurniture[appState.insideBuildingId];
      }
      return appState.outdoorFurniture;
    }

    function placeFurnitureInFront() {
      const list = getCurrentFurnitureList();
      const dObj = getDecorById(appState.selectedDecorId);
      list.push({
        id: `furn_${Date.now()}`,
        typeId: dObj.id,
        x: Number((playerPose.x + Math.sin(playerPose.yaw) * 1.8).toFixed(1)),
        z: Number((playerPose.z + Math.cos(playerPose.yaw) * 1.8).toFixed(1)),
        rot: Math.round((playerPose.yaw * 180) / Math.PI)
      });
      SoundEngine.candy();
      showToast(`${dObj.icon} ${dObj.name} を配置しました！`);
      saveState(); renderAll();
    }

    function rotateLastFurniture() {
      const list = getCurrentFurnitureList();
      if (!list.length) return;
      list[list.length - 1].rot = (list[list.length - 1].rot + 45) % 360;
      SoundEngine.tap(); saveState(); renderAll();
    }

    function removeLastFurniture() {
      const list = getCurrentFurnitureList();
      if (!list.length) return;
      list.pop();
      SoundEngine.tap(); saveState(); renderAll();
    }

    function movePlayer(fAmt, sAmt, tAmt) {
      playerPose.yaw += tAmt;
      playerPose.x += Math.sin(playerPose.yaw) * fAmt + Math.cos(playerPose.yaw) * sAmt;
      playerPose.z += Math.cos(playerPose.yaw) * fAmt - Math.sin(playerPose.yaw) * sAmt;
      const bound = appState.insideBuildingId ? 5.2 : 8.5;
      playerPose.x = Math.max(-bound, Math.min(bound, playerPose.x));
      playerPose.z = Math.max(-bound, Math.min(bound, playerPose.z));
    }

    function updateCampAI(dt) {
      const companion = aiAgents.find((a) => a.id === appState.selectedKotomonId) || aiAgents[0];
      aiAgents.forEach((ag) => {
        if (ag.id === companion.id) {
          const tx = playerPose.x - Math.sin(playerPose.yaw) * 1.4 + Math.cos(playerPose.yaw) * 0.9;
          const tz = playerPose.z - Math.cos(playerPose.yaw) * 1.4 - Math.sin(playerPose.yaw) * 0.9;
          ag.x += (tx - ag.x) * Math.min(1, dt * 3.5);
          ag.z += (tz - ag.z) * Math.min(1, dt * 3.5);
          ag.state = appState.insideBuildingId ? "室内同行" : "一緒に散策";
          return;
        }
        ag.timer -= dt;
        if (ag.timer <= 0) {
          ag.timer = 1.6 + Math.random() * 2.0;
          ag.state = ag.id === "shogun_hito" ? "建築設計" : "散策";
          const ang = Math.random() * Math.PI * 2;
          ag.vx = Math.cos(ang) * 0.9; ag.vz = Math.sin(ang) * 0.9;
        }
        ag.x += ag.vx * dt; ag.z += ag.vz * dt;
        if (Math.abs(ag.x) > 5.5) ag.vx *= -1;
        if (Math.abs(ag.z) > 5.5) ag.vz *= -1;
      });
    }

    function renderCampCanvas(canvas) {
      if (!canvas) return;
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const rect = canvas.getBoundingClientRect();
      const w = Math.max(300, Math.floor(rect.width));
      const h = Math.max(210, Math.floor(rect.height));
      if (canvas.width !== w * dpr || canvas.height !== h * dpr) { canvas.width = w * dpr; canvas.height = h * dpr; }
      const ctx = canvas.getContext("2d");
      ctx.save(); ctx.scale(dpr, dpr);
      const insideArch = appState.insideBuildingId ? getArchById(appState.insideBuildingId) : null;

      if (!appState.campFirstPerson) {
        ctx.fillStyle = insideArch ? "#2b241d" : "#1d3f2e";
        ctx.fillRect(0, 0, w, h);
        const cx = w / 2, cy = h / 2, sc = 13;
        if (!insideArch) {
          appState.builtArchitecture.slice(0, 12).forEach((bid, idx) => {
            const arch = getArchById(bid);
            if (!arch) return;
            const bx = cx + ((idx % 4) - 1.5) * 64, by = cy - 52 - Math.floor(idx / 4) * 34;
            const sz = arch.isCathedral ? 28 : 16;
            ctx.fillStyle = arch.color;
            ctx.fillRect(bx - sz, by - sz * 0.65, sz * 2, sz * 1.3);
            ctx.strokeStyle = arch.isCathedral ? "#ffd56b" : "#fff";
            ctx.strokeRect(bx - sz, by - sz * 0.65, sz * 2, sz * 1.3);
            ctx.fillStyle = "#fff"; ctx.font = "bold 9px sans-serif"; ctx.textAlign = "center";
            ctx.fillText(arch.isCathedral ? "⛪大聖堂" : arch.name.slice(0, 8), bx, by - sz * 0.65 - 3);
          });
        }
        getCurrentFurnitureList().forEach((f) => {
          const dObj = getDecorById(f.typeId);
          ctx.fillStyle = dObj.color;
          ctx.beginPath(); ctx.arc(cx + f.x * sc, cy + f.z * sc, 6.5, 0, Math.PI * 2); ctx.fill();
        });
        aiAgents.forEach((ag) => {
          const sp = getSpeciesById(ag.id);
          const st = sp.stages[appState.kotomonProgress[ag.id].stage - 1];
          ctx.fillStyle = st.accent;
          ctx.beginPath(); ctx.arc(cx + ag.x * sc, cy + ag.z * sc, 7.5, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = "#fff"; ctx.font = "bold 9.5px sans-serif"; ctx.textAlign = "center";
          ctx.fillText(st.name, cx + ag.x * sc, cy + ag.z * sc - 10);
        });
        ctx.fillStyle = "#ffdd57";
        ctx.beginPath(); ctx.arc(cx + playerPose.x * sc, cy + playerPose.z * sc, 7.5, 0, Math.PI * 2); ctx.fill();
      } else {
        const horizonY = h * 0.48;
        ctx.fillStyle = insideArch ? "#3b2c35" : "#2f6448";
        ctx.fillRect(0, 0, w, horizonY);
        ctx.fillStyle = insideArch ? "#573f2d" : "#244d35";
        ctx.fillRect(0, horizonY, w, h - horizonY);

        const projectObj = (wx, wz, col, label, rBase) => {
          const dx = wx - playerPose.x, dz = wz - playerPose.z;
          const cos = Math.cos(-playerPose.yaw), sin = Math.sin(-playerPose.yaw);
          const rx = dx * cos - dz * sin, rz = dx * sin + dz * cos;
          if (rz <= 0.4) return;
          const sx = w / 2 + (rx / rz) * 250;
          const sy = horizonY + (1.2 / rz) * (h * 0.44);
          const rad = Math.max(6, (rBase / rz) * 26);
          ctx.fillStyle = col;
          ctx.beginPath(); ctx.arc(sx, sy - rad * 0.4, rad, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = "#fff"; ctx.font = "bold 10px sans-serif"; ctx.textAlign = "center";
          ctx.fillText(label, sx, sy - rad * 1.4 - 4);
        };

        getCurrentFurnitureList().forEach((f) => {
          const dObj = getDecorById(f.typeId);
          projectObj(f.x, f.z, dObj.color, `${dObj.icon}${dObj.name}`, 0.9);
        });
        aiAgents.forEach((ag) => {
          const sp = getSpeciesById(ag.id);
          const st = sp.stages[appState.kotomonProgress[ag.id].stage - 1];
          projectObj(ag.x, ag.z, st.accent, `${st.name}（${ag.state}）`, 1.05);
        });
      }
      ctx.restore();
    }

    function campLoop(now) {
      const dt = Math.min(0.05, (now - lastFrameTime) / 1000);
      lastFrameTime = now;
      if (appState.activeTab === "camp") {
        updateCampAI(dt);
        renderCampCanvas(document.getElementById("campCanvas"));
      }
      requestAnimationFrame(campLoop);
    }

    function translateSample(text, lang) {
      const map = {
        en: `[EN] ${text} (Study & Kotomon adventure!)`,
        zh: `[中文] ${text}（一起努力学习吧！）`,
        ko: `[KO] ${text} (함께 공부해요!)`,
        es: `[ES] ${text} (¡Estudiemos juntos!)`,
        fr: `[FR] ${text} (Étudions ensemble !)`
      };
      return map[lang] || `[${lang.toUpperCase()}] ${text}`;
    }

    function pullTenGacha() {
      const cost = 500;
      if (appState.money < cost) { SoundEngine.wrong(); showToast("コトマネーが500必要です！"); return; }
      appState.money -= cost;
      const results = Array.from({ length: 10 }, (_, idx) => {
        const sp = KOTOMON_CATALOG[Math.floor(Math.random() * KOTOMON_CATALOG.length)];
        const st = sp.stages[Math.floor(Math.random() * 4)];
        const decor = DECORATION_CATALOG_1000[Math.floor(Math.random() * DECORATION_CATALOG_1000.length)];
        appState.candy += 1;
        const prog = appState.kotomonProgress[sp.id];
        prog.ev.spa = Math.min(252, (prog.ev.spa || 0) + 3);
        return `${idx + 1}. ${st.name}＋${decor.icon}${decor.code}`;
      });
      appState.lastGachaPulls = results;
      SoundEngine.purchase();
      showToast("✨ 10連召喚完了！勉強飴×10＆限定装飾を獲得！");
      saveState(); renderAll();
    }

        document.getElementById("modalTitle").textContent = "📘 ボードゲーム＆特殊ルールブック（全8種）";
        document.getElementById("modalBody").innerHTML = BOARD_GAMES_8.map((g) => `
          <div style="margin-bottom:10px;padding-bottom:8px;border-bottom:1px dashed rgba(0,0,0,0.14);">
            <strong>${g.name}</strong><br/><span>特殊ルール：${g.special}</span>
          </div>
        `).join("");
        document.getElementById("detailModal").classList.add("open");
      });
    }

    function renderShopAndGachaView(container) {
      container.innerHTML = `
        <section class="section-card">
          <div class="card-title-row">
            <h2 class="card-title">✨ 森の10連ガチャ</h2>
            <span class="sub-chip">10連：500コトマネー</span>
          </div>
          <p style="font-size:12px;margin:0 0 8px;">10連で勉強飴×10・努力値ブースト・全1,000種装飾を獲得！</p>
          <button class="btn-gold" id="btnPull10" style="width:100%;">🌟 10連ガチャを引く（500コトマネー）</button>
          ${appState.lastGachaPulls.length ? `
            <div class="gacha-results">
              ${appState.lastGachaPulls.map((r) => `<div class="gacha-card">${r}</div>`).join("")}
            </div>
          ` : ""}
        </section>

        <section class="section-card">
          <div class="card-title-row">
            <h2 class="card-title">🛒 コトマネー専用ショップ（指紋認証決済）</h2>
            <span class="sub-chip">完全ゲーム内通貨</span>
          </div>
          <p style="font-size:12px;margin:0;">勉強飴5個セット（200コトマネー）を、指紋センサー長押し認証＆決済サウンドで購入できます。</p>
          <div class="fingerprint-zone">
            <div style="font-size:11.5px;font-weight:800;margin-bottom:8px;">👆 指紋マークを長押し（0.7秒）して購入認証</div>
            <button class="fp-btn" id="btnFingerprintPay">🫆</button>
            <div id="fpStatus" style="font-size:11px;font-weight:800;margin-top:8px;color:var(--accent-sky);">待機中</div>
          </div>
        </section>

        <section class="section-card">
          <div class="card-title-row">
            <h2 class="card-title">🚧 近日公開（Coming Soon）</h2>
            <span class="sub-chip">拡張スロット</span>
          </div>
          <p style="font-size:12px;color:var(--ink-muted);margin:0;">季節イベント・追加コトモン・新ワールド拡張エリアを順次追加予定！</p>
        </section>
      `;

      document.getElementById("btnPull10").addEventListener("click", pullTenGacha);
      const fpBtn = document.getElementById("btnFingerprintPay");
      const fpStatus = document.getElementById("fpStatus");
      let holdTimer = null;

      const startHold = () => {
        if (appState.money < 200) { SoundEngine.wrong(); fpStatus.textContent = "コトマネー不足（200必要）"; return; }
        fpBtn.classList.add("scanning");
        fpStatus.textContent = "指紋スキャン中...";
        holdTimer = setTimeout(() => {
          appState.money -= 200; appState.candy += 5;
          fpBtn.classList.remove("scanning"); SoundEngine.purchase();
          fpStatus.textContent = "✅ 認証完了！勉強飴×5を獲得しました";
          showToast("🍬 勉強飴×5を購入しました！");
          saveState(); renderAll();
        }, 700);
      };
      const cancelHold = () => { clearTimeout(holdTimer); fpBtn.classList.remove("scanning"); };
      fpBtn.addEventListener("pointerdown", startHold);
      fpBtn.addEventListener("pointerup", cancelHold);
      fpBtn.addEventListener("pointerleave", cancelHold);
    }

    function renderAll() {
      renderHeader();
      const main = document.getElementById("mainView");
      document.querySelectorAll(".nav-item").forEach((n) => n.classList.toggle("active", n.dataset.tab === appState.activeTab));
      if (appState.activeTab === "dex") renderDexView(main);
      else if (appState.activeTab === "battle") renderBattleView(main);
      else if (appState.activeTab === "camp") renderCampView(main);
      else if (appState.activeTab === "social") renderSocialAndBoardView(main);
      else renderShopAndGachaView(main);
    }

    document.getElementById("btnReplaySplash").addEventListener("click", () => { SoundEngine.tap(); runSplashSequence(); });
    document.getElementById("btnSound").addEventListener("click", () => { const on = SoundEngine.toggle(); renderHeader(); showToast(on ? "サウンド ON" : "サウンド OFF"); });
    document.getElementById("btnCloseModal").addEventListener("click", () => { SoundEngine.tap(); document.getElementById("detailModal").classList.remove("open"); });
    document.getElementById("detailModal").addEventListener("click", (e) => { if (e.target.id === "detailModal") document.getElementById("detailModal").classList.remove("open"); });
    document.querySelectorAll(".nav-item").forEach((item) => {
      item.addEventListener("click", () => {
        SoundEngine.tap();
        appState.activeTab = item.dataset.tab;
        if (appState.activeTab === "battle" && !currentQuestion) startBattle();
        saveState(); renderAll();
      });
    });

    runSplashSequence();
    renderAll();
    requestAnimationFrame(campLoop);
  </script>
</body>
</html>
